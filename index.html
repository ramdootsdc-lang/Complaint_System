<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="logo">ComplaintSys</h1>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>

            </ul>
        </div>
